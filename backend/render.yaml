services:
  - type: web
    name: breathway-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
